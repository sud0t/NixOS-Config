# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts
font_family      Hack Nerd Font
bold_font        auto
italic_font      Adwaita-Mono-Italic
bold_italic_font Adwaita-Mono-Bold-Italic
font_size 11.0

#: Cursor
cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

#: Windows / remote control
confirm_os_window_close 0
allow_remote_control yes

#: Keyboard shortcuts
kitty_mod alt+shift
map ctrl+shift+c copy_or_noop
map ctrl+shift+v paste_from_clipboard
map kitty_mod+l next_tab
map kitty_mod+h previous_tab
map kitty_mod+q new_tab_with_cwd
map kitty_mod+c close_tab
map kitty_mod+t set_tab_title
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+plus   change_font_size all +2.0
map ctrl+shift+minus       change_font_size all -2.0
map ctrl+equal change_font_size all 0

#: Colors (generated by Noctalia)
include themes/noctalia.conf
